xml
<svg xmlns="http://www.w3.org" viewBox="0 0 100 100">
  <defs>
    <!-- Gradiente azzurro elettrico per l'effetto trasmissione -->
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0077ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00f2ff;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <style>
    .helix { transform-origin: center; animation: rotate 5s linear infinite; }
    .pulse { animation: flow 2s ease-in-out infinite; }
    @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes flow { 0% { stroke-dashoffset: 100; } 100% { stroke-dashoffset: 0; } }
  </style>

  <!-- Sfondo circolare scuro (opzionale, per far risaltare l'azzurro) -->
  <circle cx="50" cy="50" r="48" fill="#0a0a0a" />

  <g class="helix">
    <!-- I due filamenti dell'elica -->
    <path d="M30,25 Q50,50 70,25" stroke="url(#grad)" stroke-width="6" fill="none" stroke-linecap="round" />
    <path d="M30,75 Q50,50 70,75" stroke="url(#grad)" stroke-width="6" fill="none" stroke-linecap="round" />
    
    <!-- I pioli (ponti) che danno l'idea del laboratorio/dati -->
    <line x1="40" y1="40" x2="60" y2="40" stroke="url(#grad)" stroke-width="2" opacity="0.5" />
    <line x1="40" y1="60" x2="60" y2="60" stroke="url(#grad)" stroke-width="2" opacity="0.5" />
    
    <!-- L'impulso "messaggio" che scorre -->
    <path class="pulse" d="M30,25 Q50,50 70,25" stroke="white" stroke-width="2" fill="none" 
          stroke-dasharray="10, 90" stroke-linecap="round" />
  </g>
</svg>