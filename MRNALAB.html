<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>mRNALab | BlackBox v22.2 FINAL-GUARD</title>
    <!-- CARICAMENTO DEL PONTE BINARIO (WASM) -->
    <script src="segreto.js"></script>
    
    <style>
        :root { --red: #ff0000; --green: #00ff41; --yellow: #ffcf00; --blue: #00e5ff; --bg: #050505; --font: 'Courier New', monospace; }
        body { background: var(--bg); color: #fff; font-family: var(--font); display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; margin: 0; user-select: none; }
        #notify-banner { position: fixed; top: 0; left: 0; width: 100%; padding:10px; text-align: center; z-index: 9999; font-size: 0.7rem; border-bottom: 1px solid #333; background: rgba(0,0,0,0.95); transition: 0.3s; height: 20px; }
        .notify-error { background: var(--red) !important; color: #fff; }
        .notify-success { background: var(--green) !important; color: #000; }
        #ui-wrapper { display: flex; gap: 15px; max-width: 1400px; padding: 20px; flex-wrap: wrap; justify-content: center; }
        .panel { background: rgba(10,10,10,0.98); border: 1px solid #222; padding: 20px; }
        .main-panel { width: 380px; border-top: 3px solid #444; }
        .side-vault { width: 320px; border: 1px solid var(--red); border-top: 3px solid var(--red); }
        .rsa-panel { width: 320px; border: 1px solid var(--blue); border-top: 3px solid var(--blue); }
        h1 { font-size: 0.9rem; letter-spacing: 3px; color: var(--red); text-align: center; margin-bottom: 15px; }
        h2 { font-size: 0.6rem; color: var(--blue); text-transform: uppercase; margin-bottom: 10px; text-align: center; }
        textarea, .key-input { background: #000; border: 1px solid #222; color: var(--green); width: 100%; outline: none; font-family: var(--font); box-sizing: border-box; resize: none; font-size: 0.55rem; padding: 8px; }
        .key-slot { background: #080808; border: 1px solid #1a1a1a; padding: 8px; margin-bottom: 8px; position: relative; }
        .key-label { font-size: 0.5rem; color: #555; text-transform: uppercase; display: block; margin-bottom: 4px; }
        .blindatura-box { border: 1px groove #444; padding: 10px; margin: 5px 0; display: flex; align-items: center; justify-content: space-between; font-size: 0.55rem; color: #888; }
        #check-icon, #check-icon-restore { font-size: 0.8rem; font-weight: bold; color: #444; }
        .active-green { color: var(--green) !important; text-shadow: 0 0 5px var(--green); }
        button { width: 100%; background: transparent; border: 1px solid #444; color: #888; padding: 8px; cursor: pointer; text-transform: uppercase; font-size: 0.5rem; font-weight: 900; margin-top: 5px; transition: 0.2s; }
        button:not(:disabled):hover { background: #fff; color: #000; }
        button:disabled { cursor: not-allowed; opacity: 0.2; }
        .btn-blue { border-color: var(--blue) !important; color: var(--blue) !important; }
        .btn-red { border-color: var(--red) !important; color: var(--red) !important; }
        .btn-green { border-color: var(--green) !important; color: var(--green) !important; }
        .btn-yellow { border-color: var(--yellow) !important; color: var(--yellow) !important; }
        
        #panic-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 10000; display: none; }
        #panic-integrated-container { 
            display: none; margin-top: 10px; position: relative; z-index: 10001; 
            border: 1px solid var(--red); background: #050505; padding: 10px; 
        }
        .panic-flex { display: flex; align-items: center; gap: 5px; }
        .panic-input-box { background: #000; border: 1px solid #222; color: var(--red); flex-grow: 1; font-family: var(--font); font-size: 0.6rem; padding: 5px; outline: none; }
        .panic-btn-icon { width: 30px !important; margin-top: 0 !important; border-color: var(--red) !important; color: var(--red) !important; }
        .eye-btn { cursor: pointer; color: #444; font-size: 0.7rem; padding: 0 5px; user-select: none; }
    </style>
</head>
<body oncontextmenu="return false;">

<div id="panic-overlay"></div>
<div id="notify-banner">INITIALIZING CORE BINARIO...</div>

<div id="ui-wrapper">
    <!-- PANEL 1: RSA -->
    <div class="panel rsa-panel">
        <h2>1. RSA Key & Identity</h2>
        <button onclick="genRSA()" class="btn-blue">A. Genera Mie Chiavi</button>
        <div class="key-slot" style="margin-top:10px;">
            <span class="key-label">Passphrase Blindatura Backup</span>
            <input type="password" id="kp" class="key-input" placeholder="Min. 15 char..." oninput="validateBlindatura(this.value)">
            <div class="blindatura-box"><span>BLINDATURA BACKUP</span><span id="check-icon">[ ]</span></div>
            <button id="btn-backup-priv" onclick="exportPrivateKey()" class="btn-red" disabled>Backup PrivKey</button>
        </div>
        <div class="key-slot" style="margin-top:10px; border: 1px solid var(--green);">
            <span class="key-label">Passphrase Sblocco Restore</span>
            <input type="password" id="kp-restore" class="key-input" placeholder="Min. 15 char..." oninput="validateRestore(this.value)">
            <div class="blindatura-box"><span>BLINDATURA RESTORE</span><span id="check-icon-restore">[ ]</span></div>
            <button id="btn-restore-priv" onclick="document.getElementById('priv-file-in').click()" class="btn-green" disabled>Esegui Restore</button>
            <input type="file" id="priv-file-in" style="display:none" onchange="importPrivateKey(this)">
        </div>
        <button onclick="exportPublicKey()" class="btn-blue">Export PubKey</button>
        <div class="key-slot" style="margin-top:10px;">
            <button onclick="document.getElementById('pub-file-in').click()" class="btn-blue">Import Dest. PubKey</button>
            <input type="file" id="pub-file-in" style="display:none" onchange="importPublicKey(this)">
            <textarea id="pub-active" style="height:35px; margin-top:5px;" placeholder="Lucchetto attivo..."></textarea>
        </div>
        <button onclick="sealPassWASM()" class="btn-blue">B. SIGILLA PASSPHRASE (WASM)</button>
        <textarea id="sealed-pass" style="height:35px; margin-top:5px;" class="key-input" placeholder="Token RSA..."></textarea>
        <button onclick="unsealPass()" class="btn-green">C. Dissigilla Passphrase</button>
    </div>

    <!-- PANEL 2: MAIN -->
    <div class="panel main-panel">
        <h1>mRNALab.it</h1>
        <textarea id="msg" style="height:150px;" placeholder="Messaggio..."></textarea>
        <div class="key-slot"><span class="key-label">Session ID (SID)</span><input type="text" id="alpha" class="key-input" readonly></div>
        <button onclick="genSID()">Genera SID</button>
        <button onclick="exportPack()" class="btn-yellow">Export .JSON Pack</button>
        <button onclick="document.getElementById('json-file-in').click()" class="btn-yellow">Import .JSON Pack</button>
        <input type="file" id="json-file-in" style="display:none" onchange="handleFile(this)">
        
        <button onclick="instantWipe()" class="btn-red" style="margin-top: 25px; font-size: 1.5rem; background: rgba(255,0,0,0.1); border-width: 2px;">☣️</button>
        
        <button onclick="togglePanicBox()" class="btn-red" style="margin-top: 15px; border-style: dashed;"> OFFUSCAMENTO </button>
        
        <div id="panic-integrated-container">
            <span class="key-label">Passcode di Sicurezza</span>
            <div class="panic-flex">
                <input type="password" id="panic-input" class="panic-input-box" placeholder="Password..." oninput="checkAutoUnlock(this.value)">
                <span class="eye-btn" onclick="togglePanicEye()">👁️</span>
                <button onclick="activatePanicLock()" class="panic-btn-icon">🔒</button>
            </div>
        </div>
    </div>

    <!-- PANEL 3: VAULT -->
    <div class="panel side-vault">
        <h2>2. Data Vault (AES)</h2>
        <div class="key-slot">
            <span class="key-label">Master Passphrase Messaggio</span>
            <input type="password" id="vp" class="key-input" placeholder="Password...">
            <button onclick="genStrongPass()" class="btn-yellow" style="margin-top:8px; font-size:0.45rem;">Genera 24-char OTP</button>
        </div>
        <button onclick="lockVault()" class="btn-red">Cripta Messaggio</button>
        <textarea id="vt" style="height:110px; color:var(--yellow); margin-top:10px;" class="key-input" placeholder="Token AES..."></textarea>
        <button onclick="unlockVault()" class="btn-green">Decripta Messaggio</button>
    </div>
</div>

<script>
    let vaultInstance = null;
    let myKeyPair = { publicKey: null, privateKey: null };
    let destPubKey = null;
    let panicPass = ""; 
    const buf2b64 = b => btoa(String.fromCharCode(...new Uint8Array(b)));
    const b642buf = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

    // 1. INIZIALIZZAZIONE WASM
    Module().then(instance => {
        vaultInstance = instance;
        document.getElementById('notify-banner').innerText = "RSA-VAULT VERIFIED | mRNALab v22.2";
        document.getElementById('notify-banner').style.color = "var(--green)";
    }).catch(err => {
        document.getElementById('notify-banner').innerText = "CORE ERROR: WASM OFFLINE";
        document.getElementById('notify-banner').style.color = "var(--red)";
    });

    function _not(m, t) {
        const b = document.getElementById('notify-banner');
        b.innerText = m;
        b.className = t === "success" ? "notify-success" : "notify-error";
        setTimeout(() => { b.className = ""; b.innerText = "RSA-VAULT VERIFIED | mRNALab v22.2"; }, 3000);
    }

    // 2. FUNZIONE BLINDATA WASM
    function sealPassWASM() {
        const msg = document.getElementById('msg').value;
        const pass = document.getElementById('kp').value;
        if (!vaultInstance) return _not("CORE NON PRONTO", "error");
        if (!msg || !pass) return _not("DATI MANCANTI", "error");
        try {
            const risultato = vaultInstance.cifraMessaggio(msg, pass);
            document.getElementById('sealed-pass').value = risultato;
            _not("SIGILLO BINARIO COMPLETATO", "success");
        } catch (e) { _not("ERRORE VIOLAZIONE CORE", "error"); }
    }

    function togglePanicBox() {
        const box = document.getElementById('panic-integrated-container');
        box.style.display = (box.style.display === 'none' || box.style.display === '') ? 'block' : 'none';
        if(box.style.display === 'block') document.getElementById('panic-input').focus();
    }

    function togglePanicEye() {
        const input = document.getElementById('panic-input');
        input.type = (input.type === "password") ? "text" : "password";
    }

    function activatePanicLock() {
        const input = document.getElementById('panic-input');
        if (input.value.length > 0) {
            panicPass = input.value;
            document.getElementById('panic-overlay').style.display = 'block';
            input.value = "";
            _not("OFFUSCAMENTO ATTIVO", "error");
        }
    }

    function checkAutoUnlock(val) {
        if (panicPass !== "" && val === panicPass) {
            document.getElementById('panic-overlay').style.display = 'none';
            document.getElementById('panic-input').value = "";
            panicPass = "";
            _not("SISTEMA RIPRISTINATO", "success");
        }
    }

    function instantWipe() {
        myKeyPair = { publicKey: null, privateKey: null };
        destPubKey = null; panicPass = "";
        document.querySelectorAll('input, textarea').forEach(el => { el.value = ""; if(el.type === "file") el.value = null; });
        document.getElementById('check-icon').innerText = "[ ]";
        document.getElementById('check-icon-restore').innerText = "[ ]";
        document.getElementById('btn-backup-priv').disabled = true;
        document.getElementById('btn-restore-priv').disabled = true;
        _not("SESSIONE DISTRUTTA", "error");
    }

    function validateBlindatura(pw) {
        const regex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@#$%^&+=!]).{15,}$/;
        const icon = document.getElementById('check-icon');
        const btn = document.getElementById('btn-backup-priv');
        if (regex.test(pw)) { icon.innerText = "[OK]"; icon.className = "active-green"; btn.disabled = false; }
        else { icon.innerText = "[ ]"; icon.className = ""; btn.disabled = true; }
    }

    function validateRestore(pw) {
        const regex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@#$%^&+=!]).{15,}$/;
        const icon = document.getElementById('check-icon-restore');
        const btn = document.getElementById('btn-restore-priv');
        const backupPw = document.getElementById('kp').value;
        if (regex.test(pw) && (pw !== backupPw && pw !== "")) { icon.innerText = "[OK]"; icon.className = "active-green"; btn.disabled = false; }
        else { icon.innerText = "[ ]"; icon.className = ""; btn.disabled = true; }
    }

    function genSID() { document.getElementById('alpha').value = Math.random().toString(36).substring(2, 11).toUpperCase(); }
    
    function genStrongPass() { 
        document.getElementById('vp').value = Array.from(crypto.getRandomValues(new Uint8Array(18)), b => b.toString(36)).join(''); 
        _not("OTP GENERATO", "success"); 
    }

    async function deriveKey(password, salt) {
        const enc = new TextEncoder();
        const baseKey = await window.crypto.subtle.importKey("raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]);
        return window.crypto.subtle.deriveKey({ name: "PBKDF2", salt: salt, iterations: 100000, hash: "SHA-256" }, baseKey, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
    }

    async function genRSA() {
        try {
            myKeyPair = await window.crypto.subtle.generateKey({ name: "RSA-OAEP", modulusLength: 2048, publicExponent: new Uint8Array([1,0,1]), hash: "SHA-256" }, true, ["encrypt", "decrypt"]);
            _not("CHIAVI RSA GENERATE", "success");
        } catch (e) { _not("ERRORE GENERAZIONE", "error"); }
    }

    async function exportPrivateKey() {
        if (!myKeyPair.privateKey) return _not("GENERA CHIAVI", "error");
        const pw = document.getElementById('kp').value;
        try {
            const exported = await window.crypto.subtle.exportKey("pkcs8", myKeyPair.privateKey);
            const salt = window.crypto.getRandomValues(new Uint8Array(16));
            const iv = window.crypto.getRandomValues(new Uint8Array(12));
            const aesKey = await deriveKey(pw, salt);
            const encrypted = await window.crypto.subtle.encrypt({ name: "AES-GCM", iv: iv }, aesKey, exported);
            const blob = new Blob([JSON.stringify({ salt: buf2b64(salt), iv: buf2b64(iv), data: buf2b64(encrypted) })], { type: "application/json" });
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = "mRNALab_PrivKey.bak"; a.click();
            _not("BACKUP SCARICATO", "success");
        } catch (e) { _not("ERRORE", "error"); }
    }

    async function importPrivateKey(input) {
        const pw = document.getElementById('kp-restore').value;
        if (!input.files[0]) return;
        const reader = new FileReader();
        reader.onload = async (e) => {
            try {
                const b = JSON.parse(e.target.result);
                const aesKey = await deriveKey(pw, b642buf(b.salt));
                const decrypted = await window.crypto.subtle.decrypt({ name: "AES-GCM", iv: b642buf(b.iv) }, aesKey, b642buf(b.data));
                myKeyPair.privateKey = await window.crypto.subtle.importKey("pkcs8", decrypted, { name: "RSA-OAEP", hash: "SHA-256" }, true, ["decrypt"]);
                _not("RESTORE COMPLETATO", "success");
            } catch (err) { _not("FALLITO", "error"); }
        };
        reader.readAsText(input.files[0]);
    }

    async function lockVault() {
        const msg = document.getElementById('msg').value;
        const pass = document.getElementById('vp').value;
        let sid = document.getElementById('alpha').value || (genSID(), document.getElementById('alpha').value);
        if (!msg || !pass) return _not("MANCA MSG O PASS", "error");
        try {
            const salt = window.crypto.getRandomValues(new Uint8Array(16));
            const iv = window.crypto.getRandomValues(new Uint8Array(12));
            const aesKey = await deriveKey(pass, salt);
            const data = new TextEncoder().encode(JSON.stringify({ sid_internal: sid, message: msg }));
            const encrypted = await window.crypto.subtle.encrypt({ name: "AES-GCM", iv: iv }, aesKey, data);
            document.getElementById('vt').value = JSON.stringify({ salt: buf2b64(salt), iv: buf2b64(iv), data: buf2b64(encrypted), sid_external: sid });
            _not("VAULT SIGILLATO", "success");
        } catch (e) { _not("ERRORE", "error"); }
    }

    async function unlockVault() {
        const vaultRaw = document.getElementById('vt').value;
        const pass = document.getElementById('vp').value;
        const sidUI = document.getElementById('alpha').value;
        if (!vaultRaw || !pass) return _not("DATI MANCANTI", "error");
        try {
            const v = JSON.parse(vaultRaw);
            if (v.sid_external !== sidUI) return _not("SID MANOMESSO", "error");
            const aesKey = await deriveKey(pass, b642buf(v.salt));
            const dec = await window.crypto.subtle.decrypt({ name: "AES-GCM", iv: b642buf(v.iv) }, aesKey, b642buf(v.data));
            const content = JSON.parse(new TextDecoder().decode(dec));
            document.getElementById('msg').value = content.message;
            _not("VAULT APERTO", "success");
        } catch (e) { _not("FALLITO", "error"); }
    }

    function exportPack() {
        const vaultRaw = document.getElementById('vt').value;
        const sid = document.getElementById('alpha').value;
        if (!vaultRaw) return _not("NULLA DA ESPORTARE", "error");
        const blob = new Blob([JSON.stringify({ sid, vault: JSON.parse(vaultRaw), rsa_token: document.getElementById('sealed-pass').value }, null, 2)], { type: "application/json" });
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `BBX_${sid}.json`; a.click();
    }

    function handleFile(input) {
        if (!input.files[0]) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const p = JSON.parse(e.target.result);
                if (p.vault) document.getElementById('vt').value = JSON.stringify(p.vault);
                if (p.rsa_token) document.getElementById('sealed-pass').value = p.rsa_token;
                if (p.sid) document.getElementById('alpha').value = p.sid;
                _not("PACK CARICATO", "success");
            } catch (err) { _not("FILE NON VALIDO", "error"); }
        };
        reader.readAsText(input.files[0]);
    }

    async function exportPublicKey() {
        if (!myKeyPair.publicKey) return _not("GENERA CHIAVI", "error");
        const exported = await window.crypto.subtle.exportKey("spki", myKeyPair.publicKey);
        const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([buf2b64(exported)], { type: "text/plain" })); a.download = "Gold_PubKey.mrnalab"; a.click();
    }

    async function importPublicKey(input) {
        if (!input.files[0]) return;
        const reader = new FileReader();
        reader.onload = async (e) => {
            try {
                destPubKey = await window.crypto.subtle.importKey("spki", b642buf(e.target.result.trim()), {name: "RSA-OAEP", hash: "SHA-256" }, true, ["encrypt"]);
                document.getElementById('pub-active').value = e.target.result.trim();
                _not("PUBKEY CARICATA", "success");
            } catch (err) { _not("PUBKEY INVALIDA", "error"); }
        };
        reader.readAsText(input.files[0]);
    }

    async function unsealPass() {
        const sealed = document.getElementById('sealed-pass').value;
        if (!myKeyPair.privateKey || !sealed) return _not("MANCA PRIVKEY O TOKEN", "error");
        try {
            const dec = await window.crypto.subtle.decrypt({ name: "RSA-OAEP" }, myKeyPair.privateKey, b642buf(sealed));
            document.getElementById('vp').value = new TextDecoder().decode(dec);
            _not("PASS DISSIGILLATA", "success");
        } catch (e) { _not("FALLITO", "error"); }
    }
</script>
</body>
</html>
