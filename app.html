<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>mRNALab | BlackBox v22.2 FINAL-GUARD</title>
    <!-- 1. CARICAMENTO DEL MOTORE BINARIO (JS generato da Emscripten) -->
    <script src="segreto.js"></script>
    
    <style>
        :root { --red: #ff0000; --green: #00ff41; --yellow: #ffcf00; --blue: #00e5ff; --bg: #050505; --font: 'Courier New', monospace; }
        body { background: var(--bg); color: #fff; font-family: var(--font); display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; margin: 0; user-select: none; }
        #notify-banner { position: fixed; top: 0; left: 0; width: 100%; padding:10px; text-align: center; z-index: 9999; font-size: 0.7rem; border-bottom: 1px solid #333; background: rgba(0,0,0,0.95); transition: 0.3s; height: 20px; }
        #ui-wrapper { display: flex; gap: 15px; max-width: 1400px; padding: 20px; flex-wrap: wrap; justify-content: center; }
        .panel { background: rgba(10,10,10,0.98); border: 1px solid #222; padding: 20px; }
        .main-panel { width: 380px; border-top: 3px solid #444; }
        .side-vault { width: 320px; border: 1px solid var(--red); border-top: 3px solid var(--red); }
        .rsa-panel { width: 320px; border: 1px solid var(--blue); border-top: 3px solid var(--blue); }
        h1 { font-size: 0.9rem; letter-spacing: 3px; color: var(--red); text-align: center; margin-bottom: 15px; }
        h2 { font-size: 0.6rem; color: var(--blue); text-transform: uppercase; margin-bottom: 10px; text-align: center; }
        textarea, .key-input { background: #000; border: 1px solid #222; color: var(--green); width: 100%; outline: none; font-family: var(--font); box-sizing: border-box; resize: none; font-size: 0.55rem; padding: 8px; }
        .key-slot { background: #080808; border: 1px solid #1a1a1a; padding: 8px; margin-bottom: 8px; position: relative; }
        .key-label { font-size: 0.5rem; color: #555; text-transform: uppercase; display: block; margin-bottom: 4px; }
        button { width: 100%; background: transparent; border: 1px solid #444; color: #888; padding: 8px; cursor: pointer; text-transform: uppercase; font-size: 0.5rem; font-weight: 900; margin-top: 5px; transition: 0.2s; }
        button:hover { background: #fff; color: #000; }
        .btn-blue { border-color: var(--blue) !important; color: var(--blue) !important; }
        .btn-red { border-color: var(--red) !important; color: var(--red) !important; }
        .btn-yellow { border-color: var(--yellow) !important; color: var(--yellow) !important; }
    </style>
</head>
<body oncontextmenu="return false;">

<div id="notify-banner">INIZIALIZZAZIONE...</div>

<div id="ui-wrapper">
    <!-- PANEL 1: RSA -->
    <div class="panel rsa-panel">
        <h2>1. RSA Key & Identity</h2>
        <button onclick="genRSA()" class="btn-blue">A. Genera Mie Chiavi</button>
        <div class="key-slot" style="margin-top:10px;">
            <span class="key-label">Passphrase Blindatura</span>
            <input type="password" id="kp" class="key-input" placeholder="Min. 15 char...">
            <button onclick="exportPrivateKey()" class="btn-red">Backup PrivKey</button>
        </div>
        <button onclick="exportPublicKey()" class="btn-blue">Export PubKey</button>
        <textarea id="sealed-pass" style="height:35px; margin-top:5px;" class="key-input" placeholder="Token RSA..."></textarea>
    </div>

    <!-- PANEL 2: MAIN -->
    <div class="panel main-panel">
        <h1>mRNALab.it</h1>
        <textarea id="msg" style="height:150px;" placeholder="Messaggio..."></textarea>
        <div class="key-slot">
            <span class="key-label">Session ID (SID)</span>
            <input type="text" id="alpha" class="key-input" readonly>
        </div>
        <button onclick="genSID()">Genera SID</button>
        <button onclick="location.reload()" class="btn-red" style="margin-top: 25px;">☣️ WIPE SESSION</button>
    </div>

    <!-- PANEL 3: VAULT -->
    <div class="panel side-vault">
        <h2>2. Data Vault (AES)</h2>
        <div class="key-slot">
            <span class="key-label">Master Passphrase</span>
            <input type="password" id="vp" class="key-input" placeholder="Password...">
            <button onclick="genStrongPass()" class="btn-yellow" style="margin-top:8px;">GENERA PASS</button>
        </div>
        <button onclick="processaCriptazione()" class="btn-yellow">CRIPTA MESSAGGIO</button>
        <textarea id="output-blindato" style="height:80px; margin-top:10px;" class="key-input" placeholder="Risultato..."></textarea>
    </div>
</div>

<script>
    // 2. LOGICA DI AGGANCIO AL FILE .WASM
    var vaultInstance = null;
    const notify = document.getElementById("notify-banner");

    // Questa funzione viene chiamata automaticamente dal tuo segreto.js
    Module.onRuntimeInitialized = function() {
        vaultInstance = Module;
        notify.innerText = "RSA-VAULT VERIFIED | mRNALab v22.2";
        notify.style.color = "var(--green)";
        console.log("Modulo WASM caricato.");
    };

    // 3. LE TUE FUNZIONI (Aggiungile qui per far funzionare i tasti)
    function genSID() {
        const sid = Math.random().toString(36).substring(2, 15).toUpperCase();
        document.getElementById("alpha").value = "SID-" + sid;
    }

    function processaCriptazione() {
        if (!vaultInstance) { alert("Modulo non pronto!"); return; }
        const msg = document.getElementById("msg").value;
        const key = document.getElementById("vp").value;
        
        try {
            // Assicurati che 'cifraMessaggio' sia il nome esatto usato nel C++
            const res = vaultInstance.cifraMessaggio(msg, key);
            document.getElementById("output-blindato").value = res;
        } catch(e) {
            alert("Errore durante la criptazione WASM.");
        }
    }

    // Aggiungi qui le altre funzioni mancanti (genRSA, exportPublicKey, ecc.)
    function genRSA() { console.log("Funzione genRSA da implementare"); }
    function exportPublicKey() { console.log("Funzione exportPublicKey da implementare"); }
    function exportPrivateKey() { console.log("Funzione exportPrivateKey da implementare"); }
    function genStrongPass() { 
        document.getElementById("vp").value = Math.random().toString(36).slice(-12); 
    }

</script>

</body>
</html>
