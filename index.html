    // --- MOTORE CRITTOGRAFICO ---
    async function calcolaHash(p, s) {
        const str = btoa(unescape(encodeURIComponent(p + s)));
        const buf = new TextEncoder().encode(str);
        const hash = await crypto.subtle.digest('SHA-256', buf);
        return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    // --- LOGICA DI INIEZIONE IMMEDIATA ---
    async function controllaAccesso() {
        const pField = document.getElementById('passField');
        const status = document.getElementById('status');
        const btn = document.getElementById('unlockBtn');
        
        status.innerText = "";
        const hashInserito = await calcolaHash(pField.value, SALT_CONFIGURATO);

        if (hashInserito === HASH_SALVATO) {
            try {
                btn.innerText = "DECRYPTING...";
                // Decodifica immediata in RAM
                const softwareHTML = decodeURIComponent(escape(atob(BLACKBOX_ENCODED))); 
                
                // Sovrascrittura atomica: cancella il login e scrive il software
                document.open();
                document.write(softwareHTML);
                document.close();
            } catch (e) {
                status.innerText = "DECODING_ERROR: INVALID_BASE64";
            }
        } else {
            status.innerText = "ACCESS_DENIED: WRONG_KEY";
            pField.value = "";
        }
    }

    // --- PREVENZIONE DOPPIO INVIO (SBLOCCO AL PRIMO COLPO) ---
    document.getElementById('passField').addEventListener('keydown', function(e) { 
        if (e.key === 'Enter') {
            e.preventDefault(); // Impedisce il refresh della pagina
            controllaAccesso(); 
        }
    });
</script>
